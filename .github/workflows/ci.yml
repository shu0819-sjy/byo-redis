name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Byte-compile
        run: python -m compileall -q byo_redis

      - name: Ruff lint
        run: ruff check byo_redis tests

      - name: Ruff format check
        run: ruff format --check byo_redis tests

      - name: Type check (hard gate)
        run: mypy byo_redis

      - name: Run tests with coverage gate (>=75)
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=75
