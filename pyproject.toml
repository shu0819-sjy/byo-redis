[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "byo-redis"
version = "0.2.3"
description = "Build-Your-Own-Redis: hardened Redis subset in Python asyncio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BYO-Redis Contributors" }]
keywords = ["redis", "asyncio", "resp", "rdb", "aof", "replication"]
dependencies = []

[project.urls]
Homepage = "https://github.com/shu0819-sjy/byo-redis"
Repository = "https://github.com/shu0819-sjy/byo-redis.git"
Issues = "https://github.com/shu0819-sjy/byo-redis/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<8",
  "coverage>=7.4,<8",
  "mypy>=1.10,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
byo-redis = "byo_redis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["byo_redis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = false
source = ["byo_redis"]
omit = ["byo_redis/cli.py", "byo_redis/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
